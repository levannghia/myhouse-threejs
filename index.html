<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biệt thự Bê tông 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fa9c4; font-family: system-ui, "Segoe UI", sans-serif; }
    canvas#scene { display: block; outline: none; }
    #panel {
      position: fixed; top: 12px; left: 12px; width: 260px; padding: 12px 14px; border-radius: 12px;
      background: rgba(18, 22, 28, 0.72); color: #eef; font-size: 13px; backdrop-filter: blur(6px);
    }
    #panel h1 { margin: 0 0 2px; font-size: 16px; }
    #panel .sub { opacity: 0.7; font-size: 12px; margin-bottom: 8px; }
    .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
    .row label { width: 100%; opacity: 0.7; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    button, select {
      flex: 1; padding: 6px 8px; border-radius: 7px; border: 1px solid #ffffff2a; background: #ffffff14;
      color: #eef; font: inherit; cursor: pointer;
    }
    button.on { background: #e8b27a; color: #1a1208; border-color: #e8b27a; font-weight: 600; }
    select option { color: #111; }
    #room {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 20px;
      background: rgba(18, 22, 28, 0.6); color: #fff; font-size: 14px; pointer-events: none;
    }
    #room:empty { display: none; }
    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px;
      text-shadow: 0 1px 3px #000; pointer-events: none; text-align: center;
    }
    #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff9; display: none; pointer-events: none; }
    body.walking #cross { display: block; }
    #lock {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 15, 25, 0.45); color: #fff; cursor: pointer; text-align: center;
    }
    #lock[hidden] { display: none; }
    #lock .card { background: rgba(10, 15, 25, 0.85); padding: 22px 30px; border-radius: 14px; max-width: 380px; margin: 16px; line-height: 1.7; }
    kbd { background: #fff2; border: 1px solid #fff4; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
    @media (max-width: 640px) { #panel { width: auto; right: 12px; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" tabindex="0"></canvas>
  <div id="panel">
    <h1>Biệt thự Bê tông</h1>
    <div class="sub">3 tầng · 12 × 18m · mái dốc + hộp lam gỗ</div>
    <div class="row"><label>Chế độ</label>
      <button data-mode="orbit">Xem ngoài</button><button data-mode="walk">Đi bộ</button></div>
    <div class="row"><label>Thời gian</label>
      <button data-time="day">Ban ngày</button><button data-time="dusk">Hoàng hôn</button></div>
    <div class="row"><label>Cắt tầng (xem mặt bằng)</label>
      <button data-floor="all">Tất cả</button><button data-floor="g">T1</button>
      <button data-floor="l2">T2</button><button data-floor="l3">T3</button></div>
    <div class="row"><label>Đi tới phòng</label>
      <select id="teleport"><option value="">— chọn phòng —</option></select></div>
    <div class="row"><button id="export">Xuất GLB (mở bằng Blender)</button></div>
  </div>
  <div id="room"></div>
  <div id="hint"></div>
  <div id="cross"></div>
  <div id="lock" hidden>
    <div class="card">
      <b>Bấm để bắt đầu đi bộ</b><br />
      <kbd>W A S D</kbd> đi · <kbd>Shift</kbd> chạy · <kbd>Chuột</kbd> nhìn<br />
      <kbd>E</kbd> mở/đóng cửa · <kbd>Esc</kbd> nhả chuột
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
